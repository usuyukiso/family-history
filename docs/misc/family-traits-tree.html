<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Семейные черты — Семейная история</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Схема на весь экран: верхняя строка (назад, дом, заголовок, выбор признака), легенда, схема. */
:root{
  --bg:#f6f7f4; --fg:#22261f; --muted:#69705f; --line:#9aa290; --card:#ffffff; --unknown:#d9dcd3; --btn:#e8eae3;
  --display:"PT Serif",Georgia,serif; --body:"PT Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1d19; --fg:#e7e9e2; --muted:#a3aa98; --line:#5f6656; --card:#272a24; --unknown:#4a4e44; --btn:#2f332b; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1d19; --fg:#e7e9e2; --muted:#a3aa98; --line:#5f6656; --card:#272a24; --unknown:#4a4e44; --btn:#2f332b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 24px;max-width:1500px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:10px}
.icon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;
  background:var(--btn);color:var(--fg);text-decoration:none;flex:none}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon:hover,.icon:focus-visible{outline:2px solid var(--line)}
h1{font-family:var(--display);font-size:1.45rem;margin:0;flex:1 1 auto;min-width:0;text-wrap:balance}
label.pick{display:flex;align-items:center;gap:8px;font-size:.95rem}
select{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 6px;padding:0;list-style:none;font-size:.9rem}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.legend .u{background:var(--unknown);border:1.5px dashed var(--line)}
.legend .grad{width:120px;height:12px;border-radius:6px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg#tree{display:block;width:100%;height:auto;min-width:900px;max-height:calc(100vh - 120px)}
.ln{stroke:var(--line);stroke-width:1.6;fill:none}
.sib{stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 4;fill:none}
.nm{font:700 13px var(--body);fill:var(--fg);text-anchor:middle}
.ec{font:400 11.5px var(--body);fill:var(--muted);text-anchor:middle}
.node.has{cursor:pointer;outline:none}
.node .ring{fill:none;stroke:transparent;stroke-width:3}
.node.has:hover .ring,.node.has:focus-visible .ring{stroke:var(--fg)}
.unk{fill:var(--unknown);stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 3}
#tip{position:fixed;pointer-events:none;background:var(--card);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:8px 11px;font-size:.9rem;box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:280px;z-index:5}
#tip b{display:block;font-family:var(--display)}
#tip span{color:var(--muted)}
/* встроенный (уменьшенный) вид на странице сайта */
.embed .wrap{padding-block:6px 4px;padding-inline:4px}
.src{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.embed .icon,.embed h1,.embed .src{display:none}
.embed svg#tree{min-width:0;max-height:none}
@media (prefers-reduced-motion: no-preference){circle.ball{transition:fill .25s}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="icon" id="back" href="family-traits/" title="Назад" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <a class="icon" href="../" title="На главную" aria-label="На главную"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
    <h1>Семейные черты</h1>
    <label class="pick" for="trait">Показать:
      <select id="trait">
        <option value="eye">цвет глаз</option>
        <option value="hair">цвет волос</option>
        <option value="height">рост</option>
      </select>
    </label>
  </div>
  <ul class="legend" id="legend"></ul>
  <div class="scroll"><svg id="tree" viewBox="0 0 1420 730" role="img" aria-label="Родословная схема"></svg></div>
  <p class="src">Основано на рассказах родственников — мамы и тёти составителя и других членов семьи, 2004, 2026 гг.</p>
</div>
<div id="tip" hidden></div>

<script>
// Тема: как на сайте (переключатель Material хранит выбор в localStorage), иначе — системная.
try{
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.endsWith("__palette")){
      const s=JSON.parse(localStorage.getItem(k)||"{}");
      if(s && s.color && s.color.scheme) document.documentElement.dataset.theme = s.color.scheme==="slate"?"dark":"light";
    }
  }
}catch(e){}
if(window.self!==window.top) document.body.classList.add("embed");

const COLORS={
  eye:{"голубые":"#5b9bd5","серо-голубые":"#8aa6b8","зелёные":"#4f9a4a","серо-зелёные":"#8c9f78","светло-карие":"#b07a45","карие":"#6e3f22"},
  hair:{"русый":"#c19a6b","среднерусый":"#a07c55","темнорусый":"#7d5d3f","шатен":"#5a3a24","тёмный шатен":"#3f281a","брюнет":"#1f1a17"}
};
const HMIN=150,HMAX=185;
function heightColor(h){
  const t=Math.max(0,Math.min(1,(h-HMIN)/(HMAX-HMIN)));
  const a=[205,226,214],b=[31,104,96];
  return "rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(",")+")";
}
const Y=[70,220,370,520,670];
// id: [подпись, ФИО, годы, x, ряд, боковая ветвь, {eye, hair, h, hTxt}]
// У живых родственников младших поколений — только первая буква имени, без всплывающей подсказки.
const P={
 ive:["Иван","Почеревин Иван Егорович","1885 – до 1938",210,0,0,{}],
 ann:["Анна","Почеревина (Сычёва) Анна Никитична","1886/89 – 1965",310,0,0,{eye:"карие",hair:"тёмный шатен",h:160,hTxt:"ок. 160 см"}],
 val:["Валентина","Плавская (Почеревина) Валентина Ивановна","1914/21 –",60,1,1,{eye:"голубые"}],
 vla:["Владимир","Почеревин Владимир Иванович","1916 –",160,1,1,{eye:"карие"}],
 ppo:["Павел","Почеревин Павел Иванович","1922 –",260,1,1,{}],
 lub:["Любовь","Давыдова (Почеревина) Любовь Ивановна","1924 – 1991",370,1,0,{eye:"серо-зелёные",hair:"шатен",h:156}],
 pda:["Павел","Давыдов Павел Иванович","1916 – 2002",470,1,0,{eye:"голубые",hair:"брюнет",h:165}],
 gri:["Григорий","Писарев Григорий Яковлевич","1919 – 1943",590,1,0,{}],
 mva:["Мария","Березовская (Писарева, Наумова) Мария Васильевна","1919 – 1990",690,1,0,{eye:"голубые",hair:"темнорусый"}],
 mno:["Мария","Новикова (Давыдова) Мария Ивановна","1906 –",800,1,1,{eye:"голубые"}],
 iva:["Иван","Озерский Иван Яковлевич","1913 – 1993",920,1,0,{eye:"светло-карие"}],
 ate:["Анна","Озерская (Братикова) Анна Терентьевна","1913 – 1981",1020,1,0,{eye:"карие"}],
 vas:["Василий","Винник Василий Акимович","1911 – 1985",1140,1,0,{eye:"карие"}],
 pol:["Полина","Винник Полина Ивановна","1917 – 2007",1240,1,0,{eye:"карие"}],
 ale:["Александр","Почеревин Александр Павлович","1946 – 2014",260,2,1,{}],
 ser:["Сергей","Давыдов Сергей Павлович","1951 – 1997",370,2,1,{eye:"карие"}],
 lar:["Л",null,null,470,2,0,{eye:"карие",hair:"шатен",h:155}],
 vlr:["Валерий","Писарев Валерий Григорьевич","1942 – 1997",590,2,0,{eye:"голубые",hair:"среднерусый",h:176}],
 nad:["Надежда","Новикова Надежда","1948",800,2,1,{eye:"голубые"}],
 yur:["Ю",null,null,940,2,0,{eye:"зелёные",hair:"темнорусый",h:178}],
 zoy:["Зоя","Озерская (Винник) Зоя Васильевна","1956 – 2018",1040,2,0,{eye:"карие",hair:"темнорусый",h:164}],
 olg:["О",null,null,1130,2,1,{eye:"карие",hair:"русый",h:164}],
 nin:["Н",null,null,1210,2,1,{eye:"карие",hair:"русый",h:167}],
 tam:["Т",null,null,1290,2,1,{eye:"карие",hair:"темнорусый",h:163}],
 nik:["Н",null,null,1370,2,1,{eye:"карие",hair:"русый",h:180,hTxt:"ок. 180 см"}],
 yul:["Ю",null,null,260,3,1,{eye:"карие"}],
 pav:["П",null,null,700,3,0,{eye:"серо-голубые",hair:"шатен",h:178}],
 oks:["О",null,null,800,3,0,{eye:"карие",h:168}],
 c1:["Ю",null,null,700,4,0,{}],
 c2:["Д",null,null,800,4,0,{}]
};
const FAM=[
 [["ive","ann"],["val","vla","ppo","lub"]],[["lub","pda"],["ser","lar"]],[["gri","mva"],["vlr"]],
 [["ppo"],["ale"]],[["ale"],["yul"]],[["mno"],["nad"]],[["iva","ate"],["yur"]],
 [["vas","pol"],["zoy","olg","nin","tam","nik"]],[["lar","vlr"],["pav"]],[["yur","zoy"],["oks"]],[["pav","oks"],["c1","c2"]]
];
const SIB=[["pda","mno"]];
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("tree");
const el=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const R=id=>P[id][5]?21:27, X=id=>P[id][3], YY=id=>Y[P[id][4]];

const defs=el("defs",{});
const shine=el("radialGradient",{id:"shine",cx:"35%",cy:"30%",r:"60%"},defs);
el("stop",{offset:"0%","stop-color":"#fff","stop-opacity":".7"},shine);
el("stop",{offset:"45%","stop-color":"#fff","stop-opacity":"0"},shine);

FAM.forEach(([par,kids])=>{
  let sx,sy;
  if(par.length===2){
    const [a,b]=par.map(X).sort((m,n)=>m-n), y=YY(par[0]);
    el("line",{class:"ln",x1:a+R(par[0]),y1:y,x2:b-R(par[1]),y2:y});
    sx=(a+b)/2; sy=y;
  } else { sx=X(par[0]); sy=YY(par[0])+62; }
  const cy=YY(kids[0]), bus=cy-52;
  el("line",{class:"ln",x1:sx,y1:sy,x2:sx,y2:bus});
  const xs=kids.map(X).concat(sx);
  el("line",{class:"ln",x1:Math.min(...xs),y1:bus,x2:Math.max(...xs),y2:bus});
  kids.forEach(k=>el("line",{class:"ln",x1:X(k),y1:bus,x2:X(k),y2:cy-R(k)}));
});
SIB.forEach(([a,b])=>{
  const xa=X(a),xb=X(b),y=YY(a)-R(a)-4;
  el("path",{class:"sib",d:`M${xa},${y} C${xa},${y-55} ${xb},${y-55} ${xb},${y}`});
  el("text",{class:"ec",x:(xa+xb)/2,y:y-44}).textContent="брат и сестра";
});

const tip=document.getElementById("tip");
const nodes={};
function value(id,tr){
  const d=P[id][6];
  if(tr==="height") return d.h?{fill:heightColor(d.h),text:d.hTxt||d.h+" см"}:null;
  const v=tr==="eye"?d.eye:d.hair;
  return v?{fill:COLORS[tr][v],text:v}:null;
}
function tipText(id){
  const [,full,yrs,,,,d]=P[id], rows=[];
  if(d.eye) rows.push("глаза: "+d.eye);
  if(d.hair) rows.push("волосы: "+d.hair);
  if(d.h) rows.push("рост: "+(d.hTxt||d.h+" см"));
  return `<b>${full}</b>${yrs}${rows.length?"<br><span>"+rows.join("<br>")+"</span>":""}`;
}
Object.keys(P).forEach(id=>{
  const [short,full]=P[id], x=X(id), y=YY(id), r=R(id);
  const g=el("g",{class:"node"+(full?" has":"")});
  const ball=el("circle",{class:"ball",cx:x,cy:y,r},g);
  const gloss=el("circle",{cx:x,cy:y,r,fill:"url(#shine)","pointer-events":"none"},g);
  el("circle",{class:"ring",cx:x,cy:y,r:r+4},g);
  el("text",{class:"nm",x,y:y+r+17},g).textContent=short;
  const cap=el("text",{class:"ec",x,y:y+r+32},g);
  nodes[id]={ball,gloss,cap,g};
  if(!full) return;
  g.setAttribute("tabindex","0");
  const move=e=>{
    const w=tip.offsetWidth;
    tip.style.left=Math.max(8,Math.min(e.clientX+14,innerWidth-w-8))+"px";
    tip.style.top=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8)+"px";
  };
  const show=e=>{tip.innerHTML=tipText(id);tip.hidden=false;move(e)};
  g.addEventListener("mouseenter",show); g.addEventListener("mousemove",move);
  g.addEventListener("mouseleave",()=>tip.hidden=true);
  g.addEventListener("focus",()=>{const b=g.getBoundingClientRect();show({clientX:b.right,clientY:b.top})});
  g.addEventListener("blur",()=>tip.hidden=true);
  g.addEventListener("click",e=>{e.stopPropagation();show(e)});
});
document.addEventListener("click",()=>tip.hidden=true);

const lg=document.getElementById("legend"), sel=document.getElementById("trait");
function render(tr){
  const cnt={};
  Object.keys(P).forEach(id=>{
    const v=value(id,tr), n=nodes[id];
    if(v){n.ball.setAttribute("fill",v.fill);n.ball.removeAttribute("class");n.ball.classList.add("ball");n.gloss.style.display="";}
    else{n.ball.setAttribute("class","ball unk");n.ball.removeAttribute("fill");n.gloss.style.display="none";}
    n.cap.textContent=v?v.text:"неизвестно";
    const k=v?(tr==="height"?"_h":v.text):"неизвестно"; cnt[k]=(cnt[k]||0)+1;
    if(P[id][1]){const d=P[id][6];n.g.setAttribute("aria-label",P[id][1]+", "+P[id][2]+", "+(v?v.text:"неизвестно"));}
  });
  lg.innerHTML="";
  const add=h=>{const li=document.createElement("li");li.innerHTML=h;lg.appendChild(li)};
  if(tr==="height"){
    add(`<i class="grad" style="background:linear-gradient(90deg,${heightColor(HMIN)},${heightColor(HMAX)})"></i>${HMIN}–${HMAX} см — ${cnt._h||0}`);
  } else {
    Object.keys(COLORS[tr]).forEach(k=>{if(cnt[k])add(`<i style="background:${COLORS[tr][k]}"></i>${k} — ${cnt[k]}`)});
  }
  if(cnt["неизвестно"]) add(`<i class="u"></i>неизвестно — ${cnt["неизвестно"]}`);
  try{sessionStorage.setItem("trait",tr)}catch(e){}
}
let start="eye";
const fromHash=location.hash.slice(1);
if(["eye","hair","height"].includes(fromHash)) start=fromHash;
else { try{const s=sessionStorage.getItem("trait"); if(s && COLORS[s]||s==="height") start=s;}catch(e){} }
sel.value=start; render(start);
sel.addEventListener("change",()=>render(sel.value));
</script>
</body>
</html>
