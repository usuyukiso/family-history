site_name: "Биографии моих предков"
site_description: "Генеалогическая книга и каталог источников"
# Адрес нужен только для опубликованного сайта (карта сайта, канонические ссылки).
# Внутренние ссылки относительные и от него не зависят.
site_url: "https://usuyukiso.github.io/family-history/"

theme:
  name: material
  custom_dir: overrides
  language: ru
  # Значок вкладки — та же иконка, что в шапке, золотистая (#b89a56).
  favicon: assets/images/favicon.svg
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tooltips
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Включить тёмную тему
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Включить светлую тему

plugins:
  - search:
      lang: ru

hooks:
  - hooks/id_links.py
  - hooks/hidden_pages.py
  - hooks/family_tree.py
  - hooks/page_tabs.py
  - hooks/nav_counts.py
  - hooks/nav_collapsible.py
  - hooks/place_pages.py
  - hooks/document_age.py
  - hooks/household_tables.py
  - hooks/verification_status.py
  - hooks/document_registry.py
  - hooks/seo.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.magiclink

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/to-top.js
  - javascripts/family-tree.js
  - javascripts/diagram-zoom.js
  - javascripts/page-tabs.js

# Страницы, доступные только по прямой ссылке (не в меню, не в поиске, не в карте сайта).
not_in_nav: |
  /people/P1004-pavel-p.md
  /people/P1026-konon.md
  /people/P1079-yakov-ivanov-zakrevskiy.md

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

