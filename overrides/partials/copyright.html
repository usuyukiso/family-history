<div class="md-copyright">
  <nav class="footer-links" aria-label="Основные разделы">
    {#- Те же пункты и в том же порядке, что в меню под шапкой (extra.top_menu), плюс «О проекте». #}
    {% for item in config.extra.top_menu or [] %}
    <a href="{{ item.url | url }}">{{ item.title }}</a>
    {% endfor %}
    <a href="{{ 'about/' | url }}">О проекте</a>
  </nav>
  <p class="footer-visits" hidden>Просмотров сайта: <span></span></p>
  <script>
    fetch("https://usuyukiso-family-history.goatcounter.com/counter/TOTAL.json")
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(d => {
        const p = document.querySelector(".footer-visits");
        p.querySelector("span").textContent = d.count;
        p.hidden = false;
      })
      .catch(() => {});
  </script>
</div>
